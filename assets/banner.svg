<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 48px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    /* Dynamic background pulse elements */
    .spine-wave {
      stroke: #38bdf8;
      stroke-width: 3;
      fill: none;
      opacity: 0.25;
      stroke-dasharray: 8 8;
      animation: dash 30s linear infinite;
    }
    .pulse-circle {
      fill: #34d399;
      opacity: 0.15;
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .pulse-circle-2 {
      fill: #818cf8;
      opacity: 0.15;
      animation: pulse 6s ease-in-out infinite alternate-reverse;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.1; }
      100% { transform: scale(1.15); opacity: 0.25; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic / Background Animated Shapes (Behind Foreground Text) -->
  <circle cx="150" cy="100" r="180" class="pulse-circle"/>
  <circle cx="1050" cy="250" r="220" class="pulse-circle-2"/>

  <!-- Spine / Wave Dynamic Path -->
  <path class="spine-wave" d="M -100 175 Q 150 50, 400 175 T 900 175 T 1300 175" />
  <path class="spine-wave" d="M -100 200 Q 200 300, 500 200 T 1000 200 T 1300 200" opacity="0.15" />

  <!-- Foreground Content Group (Always on top) -->
  <g transform="translate(60, 0)">
    <!-- Decorative Icon / Spine Representation -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="60" height="14" rx="7" fill="#38bdf8"/>
      <rect x="10" y="22" width="40" height="14" rx="7" fill="#818cf8"/>
      <rect x="5" y="44" width="50" height="14" rx="7" fill="#34d399"/>
      <rect x="15" y="66" width="30" height="14" rx="7" fill="#f43f5e"/>
      <circle cx="30" cy="-15" r="12" fill="#38bdf8"/>
    </g>

    <!-- Main Title & Subtitle -->
    <text x="90" y="145" class="title" filter="url(#glow)">Awesome Chiropractic Software 🦴⚡</text>
    <text x="90" y="185" class="subtitle">The Ultimate Curated List of Chiropractic EHR, Practice Management &amp; SOAP Charting Solutions</text>

    <!-- Pill Badges -->
    <g transform="translate(90, 220)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="70" y="21" text-anchor="middle" class="badge-text">🏥 EHR &amp; EMR</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="237" y="21" text-anchor="middle" class="badge-text">📋 SOAP Charting</text>

      <!-- Pill 3 -->
      <rect x="335" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="415" y="21" text-anchor="middle" class="badge-text">💳 Clinic Billing</text>

      <!-- Pill 4 -->
      <rect x="510" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="590" y="21" text-anchor="middle" class="badge-text">🔓 Open Source</text>
    </g>
  </g>
</svg>
